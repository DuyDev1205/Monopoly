<section id="home" class="screen">
  <div class="home-card">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.svg" alt="Logo Cờ Tỷ Phú">
      <div class="brand-txt"><h1>Cờ Tỷ Phú <span>Việt Nam</span></h1><p>Mua đất · Xây nhà · Thành tỷ phú</p></div>
    </div>

    <div class="modes">
      <button class="tab mode active" data-tab="local"><span class="mi">🎲</span><b>Chơi với máy</b><small>Một mình hoặc nhiều người chung máy</small></button>
      <button class="tab mode" data-tab="online"><span class="mi">🌐</span><b>Chơi online</b><small>Mời bạn bè qua link hoặc mã phòng</small></button>
    </div>

    <div class="tabpane" id="tab-local">
      <div id="resumeBox" class="resume hidden"><button id="btnResume" class="btn gold wide">▶ Tiếp tục ván đang chơi</button></div>
      <div class="sec-title">Người chơi <small>Bấm vào nhân vật để đổi</small></div>
      <div id="localPlayers" class="pgrid"></div>
      <div class="sec-title">⏱ Thời gian ván</div>
      <div class="seg" id="timeSeg"><button data-t="15">15 phút</button><button data-t="30">30 phút</button><button data-t="45">45 phút</button><button data-t="60" class="on">60 phút</button></div>
      <input type="hidden" id="localTime" value="60">
      <button id="btnStartLocal" class="btn primary wide big-start">Bắt đầu chơi</button>
    </div>

    <div class="tabpane hidden" id="tab-online">
      <label class="field">Tên của bạn<input id="onName" maxlength="16" placeholder="VD: Duy"></label>
      <button id="btnCreate" class="btn primary wide big-start">Tạo phòng mới</button>
      <div class="or"><span>hoặc vào phòng có sẵn</span></div>
      <div class="row">
        <input id="onCode" class="code-in" maxlength="4" placeholder="MÃ PHÒNG" autocapitalize="characters">
        <button id="btnJoin" class="btn">Vào phòng</button>
      </div>
      <p class="hint" id="netHint"></p>
      <p class="hint">Chọn nhân vật trong phòng chờ. Chủ phòng cần giữ game mở trong lúc chơi.</p>
    </div>

    <div class="home-foot">
      <div class="themes"><span>Giao diện</span>
        <button class="theme-btn sw-sakura" data-theme="sakura" title="Hoa anh đào"><i></i>Anh đào</button>
        <button class="theme-btn sw-lantern" data-theme="lantern" title="Phố đèn lồng"><i></i>Đèn lồng</button>
        <button class="theme-btn sw-halong" data-theme="halong" title="Vịnh Hạ Long"><i></i>Hạ Long</button>
      </div>
      <div class="foot-btns">
        <button class="chip" id="btnMusicHome">🎵 Nhạc: Bật</button>
        <button class="chip" id="btnRules">📜 Luật chơi</button>
      </div>
    </div>
    <template id="rulesTpl"><ul>
        <li>Mỗi lượt gieo 2 xúc xắc. Gieo đôi được đi tiếp, gieo đôi 3 lần liền thì bị dạt ra <b>Đảo Hoang</b>.</li>
        <li>Đến đất trống: mua đất và xây ngay 1–3 nhà. Quay lại đất của mình để xây thêm, nâng từ nhà cấp 1 → cấp 2 → cấp 3, rồi lên <b>Khách sạn</b>.</li>
        <li>Đến đất người khác: trả tiền thuê, rồi có thể <b>mua lại</b> với giá gấp đôi (trừ đất đã có Khách sạn).</li>
        <li>🎆 <b>Lễ Hội</b>: chọn 1 ô đất của bạn, tiền thuê ở đó ×2. ✈️ <b>Sân Bay</b>: lượt sau bay tới đất trống, đất của mình, Xuất Phát hoặc Lễ Hội (vé 50 triệu, không bay vào đất người khác).</li>
        <li>🌴 <b>Đảo Hoang</b>: kẹt tối đa 3 lượt. Thoát bằng cách gieo đôi, trả 100tr hoặc dùng thẻ cứu hộ.</li>
        <li>👑 <b>Độc quyền</b>: sở hữu đủ một vùng màu thì mọi ô trong vùng được +50% tiền thuê.</li>
        <li>🎊 <b>Festival</b>: đầu ván chọn ngẫu nhiên 3 ô dựng cổng FESTIVAL, tiền thuê +50% tới hết ván.</li>
        <li>🏁 Dừng đúng ô <b>Xuất Phát</b>: ngoài lương còn được 1 phần thưởng ngẫu nhiên (nâng cấp miễn phí 1 nhà, thêm tiền, thẻ cứu hộ, vé bay miễn phí).</li>
        <li>🧧 <b>Cơ Hội</b> có thể là: phá nhà hoặc đốt nhà (giảm 1 cấp) của đối thủ (khách sạn được miễn), đi tới Lễ Hội, tổ chức Lễ Hội…</li>
        <li>Hết tiền thì phải bán đất cho ngân hàng (50% giá trị). Không còn gì để bán thì phá sản.</li>
        <li><b>Chiến thắng</b>: độc quyền 3 vùng màu, chiếm trọn thành phố một cạnh bàn cờ, sở hữu cả 4 khu du lịch, là người cuối cùng trụ lại, hoặc giàu nhất khi hết giờ (tối đa 60 phút).</li>
      </ul></template>
  </div>
</section>

<!-- ===== Phòng chờ online ===== -->
<section id="lobby" class="screen hidden">
  <div class="home-card">
    <div class="lobby-head">
      <button id="btnLeaveLobby" class="btn ghost small">← Rời phòng</button>
      <span class="net-dot" id="lobbyNet"></span>
    </div>
    <p class="muted center">Mã phòng</p>
    <div class="room-code" id="roomCode">----</div>
    <div class="row center">
      <button id="btnCopyLink" class="btn small">🔗 Sao chép link mời</button>
      <button id="btnShareLink" class="btn small">📤 Chia sẻ</button>
    </div>
    <div id="seatList" class="plist"></div>
    <div id="hostCtl" class="row">
      <button id="btnAddBot" class="btn ghost">＋ Thêm máy</button>
      <label class="sel">⏱ Thời gian
          <select id="onTime"><option value="15">15 phút</option><option value="30">30 phút</option><option value="45">45 phút</option><option value="60" selected>60 phút</option></select>
        </label>
    </div>
    <button id="btnStartOnline" class="btn primary wide">Bắt đầu</button>
    <p class="hint center" id="lobbyHint"></p>
  </div>
</section>

<!-- ===== Ván chơi ===== -->
<section id="game" class="screen hidden">
  <header class="topbar">
    <button id="btnMenu" class="icon-btn" title="Menu"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h18v2.2H3zm0 5h18v2.2H3zm0 5h18v2.2H3z"/></svg></button>
    <div class="tb-title">Cờ Tỷ Phú <span>Việt Nam</span></div>
    <div class="tb-right">
      <span id="roundInfo" class="pill clock"></span>
      <span id="netInfo" class="pill hidden"></span>
      <button id="btnMusic" class="icon-btn" title="Nhạc nền"></button>
      <button id="btnSound" class="icon-btn" title="Âm thanh"></button>
    </div>
  </header>
  <div class="board-wrap">
    <div class="statusbar">
      <div id="turnLabel" class="turn-label"></div>
      <div id="ticker" class="ticker"></div>
    </div>
    <div class="stage">
      <div id="board" class="board">
        <div class="center">
          <div class="dice-row">
            <div class="die3d" id="die0"></div>
            <div class="die3d" id="die1"></div>
          </div>
        </div>
        <div id="pile" class="layer3d"></div>
        <div id="buildings" class="layer3d"></div>
        <div id="tokens" class="layer3d"></div>
      </div>
      <div class="hud">
        <div id="timer" class="timer hidden"><i></i></div>
        <div id="actions" class="actions"></div>
      </div>
    </div>
    <div id="sidePanel" class="side-panel hidden"></div>
    <div id="players" class="players"></div>
    <div id="bubbles" class="bubbles"></div>
    <div id="cardStage" class="card-stage hidden">
      <div class="card3d" id="card3d">
        <div class="cface back"><div class="cb-ring"><img src="assets/icons/envelope.webp" alt=""></div><b>CƠ HỘI</b></div>
        <div class="cface front"><div class="cf-head">CƠ HỘI</div><div class="cf-ic"></div><div class="cf-text"></div></div>
      </div>
    </div>
    <form id="chatForm" class="chat hidden"><input id="chatIn" maxlength="200" placeholder="💬 Nhắn cho cả phòng…" autocomplete="off"><button class="btn small">Gửi</button></form>
  </div>
</section>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toasts"></div>
<div class="copyright">© Trần Thanh Duy</div>
<div id="tip" class="tip hidden" role="tooltip"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
