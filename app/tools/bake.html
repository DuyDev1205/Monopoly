<script type="module">
import { __bake as B } from './skin/scene3d.js';
const { THREE } = B;
const PLAYER_COLORS = ['#e5383b', '#2f6fde', '#2a9d5c', '#f2a516'];

// ---------- góc nhìn isometric dùng chung với bản PixiJS ----------
const E = 0.72;                 // góc ngẩng camera (rad)
const K = 200;                  // điểm ảnh / 1 đơn vị thế giới
const C = Math.SQRT1_2;
const DIR = new THREE.Vector3(Math.cos(E) * C, Math.sin(E), Math.cos(E) * C);
const R = new THREE.Vector3(C, 0, -C);                                  // trục ngang màn hình
const U = new THREE.Vector3(-C * Math.sin(E), Math.cos(E), -C * Math.sin(E));   // trục dọc màn hình (lên)
const LIGHT = new THREE.Vector3(-4, 9, 5).normalize();                  // hướng tới mặt trời
const OUTLINE = 2.6;            // độ dày viền (px)

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

function makeScene(obj, shadow) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#ffffff', '#8a7f99', 1.35));
  const sun = new THREE.DirectionalLight('#fff1dc', 2.3);
  sun.position.copy(LIGHT).multiplyScalar(20); sun.castShadow = shadow;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 50 });
  scene.add(sun, sun.target);
  const fill = new THREE.DirectionalLight('#cfe0ff', 0.6); fill.position.set(6, 3, 2); scene.add(fill);
  if (shadow) {
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.ShadowMaterial({ color: '#2a1d3a', opacity: 0.32 }));
    plane.rotation.x = -Math.PI / 2; plane.receiveShadow = true; scene.add(plane);
  }
  scene.add(obj);
  return scene;
}
function prep(obj) {
  obj.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = false; o.frustumCulled = false;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { if ('metalness' in m) m.metalness = 0; });
  });
}
// khung chiếu (đơn vị thế giới) của một tập điểm
function bounds(pts) {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  pts.forEach((p) => { const x = p.dot(R), y = p.dot(U); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
  return { x0, x1, y0, y1 };
}
function boxPts(box) {
  const pts = [];
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) pts.push(new THREE.Vector3(x, y, z));
  return pts;
}
function shadowPts(box) { return boxPts(box).map((p) => p.clone().addScaledVector(LIGHT, -p.y / LIGHT.y)); }
function worldBox(obj) {
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3(), b = new THREE.Box3();
  obj.traverse((c) => {
    if (!(c.isMesh || c.isSprite)) return;
    for (let p = c; p; p = p.parent) if (!p.visible) return;
    if (c.isSkinnedMesh) { c.computeBoundingBox?.(); b.copy(c.boundingBox).applyMatrix4(c.matrixWorld); } else b.setFromObject(c);
    box.union(b);
  });
  return box;
}
function cam(bd) {
  const c = new THREE.OrthographicCamera(bd.x0, bd.x1, bd.y1, bd.y0, 0.1, 200);
  c.position.copy(DIR).multiplyScalar(60); c.up.set(0, 1, 0); c.lookAt(0, 0, 0); c.updateMatrixWorld();
  return c;
}
// chụp 1 khung -> canvas (có viền tối quanh hình, bóng đổ không có viền)
function shoot(obj, bd, { shadow = true, outline = OUTLINE } = {}) {
  const w = Math.ceil((bd.x1 - bd.x0) * K), h = Math.ceil((bd.y1 - bd.y0) * K);
  renderer.setSize(w, h, false);
  const camera = cam(bd);
  // lượt 1: chỉ vật thể (để lấy hình bóng làm viền)
  const sceneA = makeScene(obj, false);
  renderer.render(sceneA, camera);
  const sil = document.createElement('canvas'); sil.width = w; sil.height = h; sil.getContext('2d').drawImage(renderer.domElement, 0, 0);
  sceneA.remove(obj);
  // lượt 2: có bóng đổ
  let col = sil;
  if (shadow) {
    const sceneB = makeScene(obj, true);
    renderer.render(sceneB, camera);
    col = document.createElement('canvas'); col.width = w; col.height = h; col.getContext('2d').drawImage(renderer.domElement, 0, 0);
    sceneB.remove(obj);
  }
  const P = Math.ceil(outline) + 1;
  const out = document.createElement('canvas'); out.width = w + P * 2; out.height = h + P * 2;
  const g = out.getContext('2d');
  if (shadow) g.drawImage(col, P, P);              // bóng đổ (lớp dưới)
  if (outline > 0) {
    const tint = document.createElement('canvas'); tint.width = w; tint.height = h;
    const tg = tint.getContext('2d'); tg.drawImage(sil, 0, 0); tg.globalCompositeOperation = 'source-in'; tg.fillStyle = 'rgba(38,24,52,0.92)'; tg.fillRect(0, 0, w, h);
    for (let a = 0; a < 16; a++) { const r = (a / 16) * Math.PI * 2; g.drawImage(tint, P + Math.cos(r) * outline, P + Math.sin(r) * outline); }
  }
  g.drawImage(sil, P, P);                          // vật thể (không lẫn bóng)
  return { canvas: out, ax: (0 - bd.x0) * K + P, ay: (bd.y1 - 0) * K + P };
}
function pad(bd, m) { return { x0: bd.x0 - m, x1: bd.x1 + m, y0: bd.y0 - m, y1: bd.y1 + m }; }
function bakeStatic(obj, { shadow = true, margin = 0.04 } = {}) {
  prep(obj);
  const box = worldBox(obj);
  const pts = boxPts(box); if (shadow) pts.push(...shadowPts(box));
  return shoot(obj, pad(bounds(pts), margin), { shadow });
}

// ---------- đóng gói nhiều khung vào 1 ảnh (atlas) ----------
function pack(items, maxW = 2048) {
  let x = 0, y = 0, rowH = 0, W = 0;
  const pos = items.map((it) => {
    const w = it.canvas.width, h = it.canvas.height;
    if (x + w > maxW) { x = 0; y += rowH + 2; rowH = 0; }
    const p = [x, y]; x += w + 2; rowH = Math.max(rowH, h); W = Math.max(W, x);
    return p;
  });
  const H = y + rowH;
  const atlas = document.createElement('canvas'); atlas.width = W; atlas.height = H;
  const g = atlas.getContext('2d');
  const frames = {};
  items.forEach((it, k) => {
    g.drawImage(it.canvas, pos[k][0], pos[k][1]);
    frames[it.name] = [pos[k][0], pos[k][1], it.canvas.width, it.canvas.height, +it.ax.toFixed(1), +it.ay.toFixed(1)];
  });
  return { data: atlas.toDataURL('image/webp', 0.9), w: W, h: H, frames };
}
const OUT = {};
function emit(name, items) { OUT[name] = pack(items); console.log('baked', name, items.length); }

// ================= mô hình Polyfork (CC BY 4.0, polyfork.dev) =================
const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
const { clone: skClone } = await import('three/addons/utils/SkeletonUtils.js');
const PF = {};
async function pf(slug) {
  if (!PF[slug]) PF[slug] = new GLTFLoader().loadAsync(`skin/models/pf/${slug}.glb`).then((g) => { g.scene.updateMatrixWorld(true); return g; });
  return PF[slug];
}
/** bản sao mô hình đặt đáy ở y=0, tâm ở giữa; fit = bề ngang tối đa, h = chiều cao, hmax = chiều cao tối đa */
async function pfModel(slug, { fit, h, hmax } = {}) {
  const g = await pf(slug);
  const o = g.animations.length && g.animations[0].name !== 'tick' ? skClone(g.scene) : g.scene.clone(true);
  o.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(o), size = box.getSize(new THREE.Vector3());
  let s = fit ? fit / Math.max(size.x, size.z) : h ? h / size.y : 1;
  if (hmax && size.y * s > hmax) s = hmax / size.y;
  o.scale.multiplyScalar(s);
  const grp = new THREE.Group(); grp.add(o);
  o.position.set(-(box.min.x + box.max.x) / 2 * s, -box.min.y * s, -(box.min.z + box.max.z) / 2 * s);
  grp.userData.height = size.y * s;
  return grp;
}
// mái nhà theo màu chủ đất: tô lại các mặt tam giác hướng lên ở phần trên của mô hình
function tintRoofs(grp, color) {
  const oc = new THREE.Color(color);
  grp.updateMatrixWorld(true);
  const H = grp.userData.height || new THREE.Box3().setFromObject(grp).getSize(new THREE.Vector3()).y;
  grp.traverse((m) => {
    if (!m.isMesh || !m.geometry.attributes.color) return;
    let geo = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
    const pos = geo.attributes.position, colA = geo.attributes.color;
    const nm = new THREE.Matrix3().getNormalMatrix(m.matrixWorld);
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3(), cen = new THREE.Vector3();
    const col = new THREE.Color();
    for (let t = 0; t < pos.count; t += 3) {
      a.fromBufferAttribute(pos, t).applyMatrix4(m.matrixWorld); b.fromBufferAttribute(pos, t + 1).applyMatrix4(m.matrixWorld); c.fromBufferAttribute(pos, t + 2).applyMatrix4(m.matrixWorld);
      n.subVectors(c, b).cross(new THREE.Vector3().subVectors(a, b)).normalize();
      cen.copy(a).add(b).add(c).divideScalar(3);
      if (n.y < 0.3 || cen.y < H * 0.42) continue;
      col.fromBufferAttribute(colA, t);
      const L = 0.3 * col.r + 0.59 * col.g + 0.11 * col.b;
      if (L > 0.75) continue;                 // bỏ qua mặt trắng (tường, bậc thềm)
      const k = 0.55 + L * 0.9;
      for (let j = 0; j < 3; j++) colA.setXYZ(t + j, Math.min(1, oc.r * k), Math.min(1, oc.g * k), Math.min(1, oc.b * k));
    }
    colA.needsUpdate = true;
    m.geometry = geo;
  });
  return grp;
}
// ---- làm chi tiết cây hoa anh đào: phủ hàng nghìn bông 5 cánh + nụ lên tán, thảm cánh hoa dưới gốc ----
function seededRnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
let FLOWER_GEO = null;
function flowerGeo() {
  if (FLOWER_GEO) return FLOWER_GEO;
  const sh = new THREE.Shape();
  const R = 1, n = 5;
  for (let i = 0; i <= n; i++) {
    const a0 = (i / n) * Math.PI * 2, a1 = ((i + 0.5) / n) * Math.PI * 2;
    if (i === 0) sh.moveTo(Math.cos(a0) * 0.18, Math.sin(a0) * 0.18);
    if (i === n) break;
    // cánh tròn, đầu cánh khía nhẹ
    sh.quadraticCurveTo(Math.cos(a0 + 0.1) * R * 1.05, Math.sin(a0 + 0.1) * R * 1.05, Math.cos(a1 - 0.08) * R * 0.92, Math.sin(a1 - 0.08) * R * 0.92);
    sh.lineTo(Math.cos(a1) * R * 0.78, Math.sin(a1) * R * 0.78);
    sh.lineTo(Math.cos(a1 + 0.08) * R * 0.92, Math.sin(a1 + 0.08) * R * 0.92);
    const a2 = ((i + 1) / n) * Math.PI * 2;
    sh.quadraticCurveTo(Math.cos(a2 - 0.1) * R * 1.05, Math.sin(a2 - 0.1) * R * 1.05, Math.cos(a2) * 0.18, Math.sin(a2) * 0.18);
  }
  FLOWER_GEO = new THREE.ShapeGeometry(sh, 3);
  return FLOWER_GEO;
}
function detailCherry(grp, seed = 1) {
  const rnd = seededRnd(seed);
  grp.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(grp.matrixWorld).invert();
  // 1) gom tam giác của tán (màu hồng) theo toạ độ của grp
  const tris = [];
  let area = 0, minY = Infinity, maxY = -Infinity, cx = 0, cz = 0, cn = 0;
  grp.traverse((m) => {
    if (!m.isMesh || !m.geometry.attributes.color) return;
    const geo = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry;
    const pos = geo.attributes.position, colA = geo.attributes.color;
    const mw = new THREE.Matrix4().multiplyMatrices(inv, m.matrixWorld);
    for (let t = 0; t < pos.count; t += 3) {
      const c = new THREE.Color().fromBufferAttribute(colA, t);
      const pink = c.r > 0.55 && c.r > c.g + 0.06 && c.b > c.g - 0.05;
      if (!pink) continue;
      const a = new THREE.Vector3().fromBufferAttribute(pos, t).applyMatrix4(mw);
      const b = new THREE.Vector3().fromBufferAttribute(pos, t + 1).applyMatrix4(mw);
      const d = new THREE.Vector3().fromBufferAttribute(pos, t + 2).applyMatrix4(mw);
      const n = new THREE.Vector3().subVectors(d, b).cross(new THREE.Vector3().subVectors(a, b));
      const ar = n.length() / 2; if (ar < 1e-6) continue;
      n.normalize();
      tris.push({ a, b, d, n, ar }); area += ar;
      [a, b, d].forEach((p) => { minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); cx += p.x; cz += p.z; cn++; });
    }
    // tán gốc tối đi một chút để hoa nổi lên
    for (let t = 0; t < colA.count; t++) {
      const c = new THREE.Color().fromBufferAttribute(colA, t);
      if (c.r > 0.55 && c.r > c.g + 0.06) colA.setXYZ(t, c.r * 0.82, c.g * 0.74, c.b * 0.8);
    }
    colA.needsUpdate = true;
    if (geo !== m.geometry) m.geometry = geo;
  });
  if (!tris.length) return grp;
  cx /= cn; cz /= cn;
  const span = maxY - minY;
  // 2) bông hoa
  const N = 7200, size = span * 0.03;
  const pal = ['#fff6fa', '#ffe3ee', '#ffcfe0', '#ffb3cc', '#ff9bbd', '#ffffff', '#ffd9e6'].map((h) => new THREE.Color(h));
  const mat = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.75, emissive: '#ff9cc2', emissiveIntensity: 0.12 });
  const fl = new THREE.InstancedMesh(flowerGeo(), mat, N);
  const buds = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ color: '#e8749a', roughness: 0.6 }), 260);
  const dm = new THREE.Object3D(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 0, 1);
  const pick = () => { let r = rnd() * area; for (const t of tris) { r -= t.ar; if (r <= 0) return t; } return tris[tris.length - 1]; };
  const sample = (t) => { let u = rnd(), v = rnd(); if (u + v > 1) { u = 1 - u; v = 1 - v; } return p.copy(t.a).addScaledVector(new THREE.Vector3().subVectors(t.b, t.a), u).addScaledVector(new THREE.Vector3().subVectors(t.d, t.a), v); };
  for (let i = 0; i < N; i++) {
    const t = pick(); sample(t);
    dm.position.copy(p).addScaledVector(t.n, (Math.pow(rnd(), 0.7) * 1.3 - 0.1) * size * 2.2);
    const nn = t.n.clone().add(new THREE.Vector3(rnd() - 0.5, rnd() * 0.6, rnd() - 0.5).multiplyScalar(0.9)).normalize();
    dm.quaternion.setFromUnitVectors(up, nn); dm.rotateZ(rnd() * 6.28);
    dm.scale.setScalar(size * (0.6 + rnd() * 0.7));
    dm.updateMatrix(); fl.setMatrixAt(i, dm.matrix);
    const c = pal[(rnd() * pal.length) | 0].clone();
    const shade = 0.88 + 0.12 * ((p.y - minY) / span);         // dưới tán tối hơn
    fl.setColorAt(i, c.multiplyScalar(shade));
  }
  for (let i = 0; i < buds.count; i++) {
    const t = pick(); sample(t);
    dm.position.copy(p).addScaledVector(t.n, size * (0.3 + rnd() * 0.9)); dm.rotation.set(0, 0, 0);
    dm.scale.set(size * 0.2, size * 0.26, size * 0.2); dm.updateMatrix(); buds.setMatrixAt(i, dm.matrix);
  }
  fl.instanceMatrix.needsUpdate = true; fl.instanceColor.needsUpdate = true;
  grp.add(fl, buds);
  // 3) thảm cánh hoa rụng
  const R = span * 0.9, M = 420;
  const pet = new THREE.InstancedMesh(new THREE.CircleGeometry(1, 6), new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.9 }), M);
  for (let i = 0; i < M; i++) {
    const a = rnd() * 6.28, r = Math.pow(rnd(), 0.6) * R;
    dm.position.set(cx + Math.cos(a) * r, 0.006 + rnd() * 0.004, cz + Math.sin(a) * r * 0.9);
    dm.rotation.set(-Math.PI / 2, 0, rnd() * 6.28);
    dm.scale.set(size * (0.5 + rnd() * 0.5), size * (0.3 + rnd() * 0.3), 1); dm.updateMatrix(); pet.setMatrixAt(i, dm.matrix);
    pet.setColorAt(i, pal[(rnd() * pal.length) | 0].clone().multiplyScalar(0.95));
  }
  pet.instanceMatrix.needsUpdate = true; pet.instanceColor.needsUpdate = true;
  const carpet = new THREE.Group(); carpet.add(pet);
  grp.userData.carpet = carpet;
  return grp;
}

const SCENES = {
  sakura: { trees: ['cherry-blossom-tree-3f7ab7', 'cherry-blossom-tree-3f7ab7', 'sculpted-pine-e45d4f', 'cherry-blossom-tree-3f7ab7'],

  midnight: { trees: ['tall-pine-tree-ab4108', 'young-pine-0d7695', 'birch-tree-181b33', 'tall-pine-tree-ab4108'],
    small: ['medium-rock-e08405', 'round-bush-cd2ac0', 'toadstool-257a4a', 'fern-plant-1559b8', 'lantern-post-f47665'], lamp: 'street-lamp-29f365' },
  wood: { trees: ['broadleaf-oak-997c22', 'maple-tree-65fa12', 'birch-tree-181b33', 'tall-pine-tree-ab4108'],
    small: ['fallen-log-1685fb', 'tree-stump-ec3f48', 'toadstool-257a4a', 'firewood-stack-8a2899', 'wildflower-68d3a1', 'round-bush-cd2ac0', 'wooden-barrel-ab50ca'] },
  ocean: { trees: ['palm-tree-a307da', 'palm-sapling-ef7ae4', 'palm-tree-a307da', 'tamarisk-bush-ba4337'],
    small: ['beach-hut-fc7649', 'lifebuoy-on-a-post-57421b', 'sandcastle-ddc562', 'driftwood-log-89a68f', 'striped-deck-chair-70b506', 'marram-grass-tuft-8c7a99'], boat: 'small-fishing-boat-4ac0e3' },
};
for (const [key, P] of Object.entries(SCENES)) {
  const items = [];
  for (let k = 0; k < P.trees.length; k++) {
    let m = await pfModel(P.trees[k], { h: k === 3 && key === 'ocean' ? 1.2 : 2.4 });
    if (P.trees[k].startsWith('cherry-blossom')) m = detailCherry(m, 11 + k * 7);
    items.push({ name: `t${k}_0`, ...bakeStatic(m, { shadow: false }) });
    if (m.userData.carpet) { const c = m.userData.carpet; prep(c); items.push({ name: `t${k}_0c`, ...shoot(c, pad(bounds(boxPts(worldBox(c))), 0.04), { shadow: false, outline: 0 }) }); }
  }
  for (let k = 0; k < P.small.length; k++) items.push({ name: `s${k}`, ...bakeStatic(await pfModel(P.small[k], { fit: 0.6, hmax: 0.75 }), { shadow: false }) });
  if (P.lamp) items.push({ name: 'lamp', ...bakeStatic(await pfModel(P.lamp, { h: 1.9 }), { shadow: false }) });
  if (P.boat) items.push({ name: 'boat', ...bakeStatic(await pfModel(P.boat, { fit: 2.2 }), { shadow: false }) });
  emit(`nat_${key}`, items);
}
// ================= 4) xúc xắc: 6 mặt cuối + khung lăn =================
{
  const mats = B.FACE_N.map((n) => new THREE.MeshStandardMaterial({ map: B.pipTex(n), roughness: 0.35 }));
  const geo = new B.RoundedBoxGeometry(0.62, 0.62, 0.62, 4, 0.1);
  const items = [];
  const mk = (q) => { const m = new THREE.Mesh(geo, mats); m.quaternion.copy(q); m.position.y = 0.31; return m; };
  for (let n = 1; n <= 6; n++) items.push({ name: `d${n}`, ...bakeStatic(mk(B.quatFor(n, Math.PI / 4)), { margin: 0.06 }) });
  for (let k = 0; k < 16; k++) {
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(k * 1.7 + 0.3, k * 2.3 + 0.9, k * 0.9 + 0.2));
    items.push({ name: `dr${k}`, ...bakeStatic(mk(q), { margin: 0.06, shadow: false }) });
  }
  emit('dice', items);
}
// ================= 5) tiền: xấp tiền, thỏi vàng, chồng xu =================
emit('money', [
  { name: 'cash', ...bakeStatic(await pfModel('banded-cash-bundle-7da278', { fit: 0.66 }), { shadow: false }) },
  { name: 'bar', ...bakeStatic(await pfModel('gold-ingot-85e62e', { fit: 0.56 }), { shadow: false }) },
  { name: 'coin', ...bakeStatic(await pfModel('gold-coin-stack-a9ef52', { fit: 0.36 }), { shadow: false }) },
]);
// ================= 6) nhân vật: các khung hoạt ảnh + chân dung =================
const CHARS = ['audience-gentleman-base', 'opera-soprano-base', 'farmer-base', 'kite-kid-base', 'schoolkid-da94c1', 'elderly-audience-member-base', 'delivery-courier-327e30', 'strategist-base'];
const FACE = { cam: Math.PI / 4, front: 0, back: -Math.PI / 2 };
const ANIMS = [   // [tên, clip, số khung, hướng]
  ['idle', 'Idle', 10, 'cam'], ['walkF', 'Walk', 8, 'front'], ['walkB', 'Walk', 8, 'back'], ['jump', 'Run', 10, 'cam'],
  ['yes', 'Idle', 10, 'cam'], ['no', 'Idle', 10, 'cam'], ['die', 'Idle', 10, 'cam'],
];
const ADULT = 1.75;           // người lớn cao 1.75m -> 1 đơn vị; trẻ em thấp hơn tự nhiên
const POR = {};
for (let k = 0; k < CHARS.length; k++) {
  const g = await pf(CHARS[k]);
  const o = skClone(g.scene);
  const s = 1 / ADULT;
  const holder = new THREE.Group(), pivot = new THREE.Group(); pivot.add(o); holder.add(pivot);
  o.scale.multiplyScalar(s);
  prep(holder);
  const mixer = new THREE.AnimationMixer(o);
  const clips = Object.fromEntries(g.animations.map((c) => [c.name, c]));
  const bone = (n) => { let r = null; o.traverse((c) => { if (!r && c.isBone && c.name.replace(/^mixamorig:?/, '') === n) r = c; }); return r; };
  const head = bone('Head'), lArm = bone('LeftArm'), rArm = bone('RightArm');
  const bd = pad(bounds([
    new THREE.Vector3(-0.6, 0, -0.6), new THREE.Vector3(0.6, 0, 0.6), new THREE.Vector3(0.6, 0, -0.6), new THREE.Vector3(-0.6, 0, 0.6),
    new THREE.Vector3(-0.6, 1.2, -0.6), new THREE.Vector3(0.6, 1.2, 0.6), new THREE.Vector3(0.6, 1.2, -0.6), new THREE.Vector3(-0.6, 1.2, 0.6),
  ]), 0.02);
  const items = [];
  for (const [an, clipName, n, face] of ANIMS) {
    holder.rotation.y = FACE[face];
    mixer.stopAllAction();
    const clip = clips[clipName] || clips.Idle;
    const act = mixer.clipAction(clip); act.reset(); act.setLoop(THREE.LoopRepeat, Infinity); act.play();
    for (let f = 0; f < n; f++) {
      const p = f / n;
      mixer.setTime(an === 'idle' || an.startsWith('walk') || an === 'jump' ? clip.duration * p : clip.duration * 0.3);
      pivot.position.set(0, 0, 0); pivot.rotation.set(0, 0, 0);
      // động tác thêm (không có sẵn trong mô hình)
      if (an === 'yes') {                    // nhún nhảy mừng + giơ tay
        pivot.position.y = Math.abs(Math.sin(p * Math.PI * 2)) * 0.12;
        const up = 0.5 + 0.5 * Math.sin(p * Math.PI * 4);
        if (lArm) lArm.rotateX(-1.6 * up);
        if (rArm) rArm.rotateX(-1.6 * up);
      } else if (an === 'no') {              // lắc đầu + xoay người
        pivot.rotation.y = Math.sin(p * Math.PI * 4) * 0.28;
        if (head) head.rotateY(Math.sin(p * Math.PI * 4) * 0.5);
      } else if (an === 'die') {             // ngã ngửa
        const e = Math.min(1, p * 1.25);
        pivot.rotation.x = -e * e * 1.45; pivot.position.z = e * 0.2;
      }
      holder.updateMatrixWorld(true);
      items.push({ name: `${an}_${f}`, ...shoot(holder, bd, { shadow: false }) });
    }
  }
  OUT[`chr${k}`] = pack(items);
  // chân dung (đầu + vai), nhìn thẳng
  {
    holder.rotation.set(0, 0.32, 0); pivot.position.set(0, 0, 0); pivot.rotation.set(0, 0, 0);
    mixer.stopAllAction(); const act = mixer.clipAction(clips.Idle); act.reset().play(); mixer.setTime(0.4);
    holder.updateMatrixWorld(true);
    const hp = head ? head.getWorldPosition(new THREE.Vector3()) : new THREE.Vector3(0, 0.9, 0);
    const scene = makeScene(holder, false);
    const cam = new THREE.PerspectiveCamera(24, 1, 0.01, 100);
    cam.position.set(hp.x + 0.12, hp.y + 0.04, hp.z + 0.95); cam.lookAt(hp.x, hp.y - 0.04, hp.z);
    renderer.setSize(512, 512, false); renderer.render(scene, cam);
    POR[k] = renderer.domElement.toDataURL('image/webp', 0.92);
    scene.remove(holder);
  }
  console.log('baked chr', k, items.length);
}
window.__POR = POR;
window.__OUT = OUT;
window.__META = { E, K };
window.done = true;
